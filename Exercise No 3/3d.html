<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .btn1{
        background-color: rgb(121, 82, 179);
        height: 50px;
        width:150px;
        color:white;
        font-weight: bold;
        font-size: 15px;
        border-radius: 5px;
        border:none;
        margin-right:10px;
    }
    .btn2{
        background-color: white;
        height: 50px;
        width:150px;
        font-weight: bold;
        font-size: 15px;
        border-radius: 5px;
        color:grey;
        border-style: solid;
        border-color: rgb(190, 176, 176);
        transition:0.3s;
       
    }
    .btn1:hover{
        opacity:0.7;

    }
    .btn2:hover{
        background-color:gray;
        border:none;
        color:white;
    }
</style>
<body>
    <button class="btn1">Get started</button>
    <button class="btn2">Download</button>
</body>
</html>
