<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* Color change when link is visited */
    a:visited{
        color:blue;
        background-color: transparent;  
        text-decoration: none;

    }
    a:hover{
        color:rgb(255, 72, 0);
    }
    h3{
        color:rgb(0, 118, 0);
    }
    p{
        font-size: large;
    }


     /* CSS of "Add to cart" button */
    .btn1{
        background-color: rgb(255, 216, 20);
        height:35px;
        width:150px;
        border-radius: 50px;
        border:none;
        margin-right:10px;
        transition:0.2s;

    }
    .btn1:hover{
        background-color: rgb(237, 206, 50);
    }
    .btn1:active{
        opacity:0.7;
    }

    
     /* CSS of "Buy now" button */
    .btn2{
        background-color: rgb(255, 164, 28);
        height:35px;
        width:150px;
        border-radius: 50px;
        border:none;
        transition:0.2s;
    }
    .btn2:hover{
        background-color:rgb(229, 148, 26) ;
    }
    .btn2:active{
        opacity:0.7;
    }
</style>
<body>
    <a href="https://apps.ankiweb.net/">Back to Amazon</a>

    <h1>Nike Black Running Shoes</h1>

    <h3>$39 - in stock.</h3>

    <p>Free delivery tommorow.</p>

    <button class="btn1">Add to Cart</button>
    <button class="btn2">Buy now</button>


</body>
</html>
